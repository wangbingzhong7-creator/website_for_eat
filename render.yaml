services:
  - type: web
    name: diancai
    runtime: python311
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/dishes
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: diancai-db
          property: connectionString

databases:
  - name: diancai-db
    plan: free
