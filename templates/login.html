<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 点菜系统</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1c1917 0%,#292524 100%);">
<div class="login-card">
  <div class="login-logo">🍜</div>
  <h1>美味点菜</h1>
  <p class="login-sub">后台管理系统</p>
  <form method="post" class="login-form">
    <div class="form-group">
      <label for="username">账号</label>
      <input type="text" id="username" name="username" placeholder="请输入账号" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" placeholder="请输入密码" required>
    </div>
    {% if error %}
    <p class="login-error">{{ error }}</p>
    {% endif %}
    <button type="submit" class="btn-login">登 录</button>
  </form>
</div>
</body>
</html>
